name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt && pip install -e .
      - name: Lint
        run: ruff check src tests scripts
      - name: Tests (end-to-end Spark run + unit tests)
        run: pytest
      - name: Generated Fabric security SQL is in sync with the semantic model
        run: |
          python -m tlake.governance > /tmp/fabric_security.sql
          diff -u docs/generated/fabric_security.sql /tmp/fabric_security.sql
