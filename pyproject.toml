[project]
name = "tlake"
version = "1.0.0"
description = "Consent-aware, AI-ready travel marketing lakehouse (Microsoft Fabric portable)"
requires-python = ">=3.10"

[tool.ruff]
line-length = 130
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B023", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tlake = ["web/*.html"]
